global:
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files:
  - /lab/rules/blackbox-alerts.yaml

scrape_configs:
  - job_name: blackbox-http
    honor_labels: true
    static_configs:
      - targets: ["collector:9464"]
        labels:
          environment: lab
          cluster: alert-lifecycle

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
